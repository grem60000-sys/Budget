<style>
:root{
  --bg:#141F1A; --bg2:#1B2C24; --card:#22382E; --card2:#2B4839;
  --line:rgba(240,233,214,.11); --line2:rgba(240,233,214,.2);
  --ink:#F0E9D6; --dim:rgba(240,233,214,.55); --faint:rgba(240,233,214,.3);
  --olive:#B4CE5E; --gold:#F5B93A; --tomato:#E9583A; --plum:#B48AEA;

  --body:"Instrument Sans",system-ui,sans-serif;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(180,206,94,.09),transparent 70%);
  background-attachment:fixed;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;padding:0 0 130px;min-height:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.03em;font-weight:800}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ── contrôles ──────────────────────────────────────────────── */
.btn{background:var(--olive);color:#16211A;border-radius:16px;padding:16px;font-family:var(--disp);
     font-weight:800;font-size:16.5px;width:100%;transition:transform .12s,filter .12s;letter-spacing:-.01em}
.btn:active{transform:scale(.975);filter:brightness(1.08)}
.btn.quiet{background:var(--card);color:var(--ink)}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink)}
.btn.danger{background:none;border:1px solid rgba(233,88,58,.45);color:var(--tomato)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.input{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:15px 16px;
       font-size:17px;width:100%;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--olive)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:13px;min-height:46px;
      padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600}
.chip.sq{width:46px;padding:0;justify-content:center;font-size:21px}
.chip[aria-pressed="true"]{border-color:var(--olive);background:var(--card2)}
.stack{display:flex;flex-direction:column;gap:15px}
.duo{display:flex;gap:10px}.duo>*{flex:1}

/* ── écran d'installation ───────────────────────────────────── */

.setup ol{padding-left:20px;margin:0;color:var(--dim);font-size:14px;line-height:1.75}

    font-family:var(--num);font-size:11.5px;line-height:1.6;color:var(--olive);margin:0}

/* ── porte d'entrée ─────────────────────────────────────────── */
.gate{padding:52px var(--pad) 40px;display:flex;flex-direction:column;gap:26px;
      min-height:100vh;justify-content:center}
.wordmark{font-family:var(--disp);font-weight:800;font-size:58px;letter-spacing:-.055em;line-height:.88}
.wordmark span{color:var(--olive)}
.code-in{font-family:var(--num);letter-spacing:.3em;text-transform:uppercase;font-size:21px;text-align:center}

/* ── entête ─────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:30;padding:14px var(--pad) 12px;display:flex;align-items:center;gap:12px;
       background:linear-gradient(var(--bg) 68%,rgba(20,31,26,0));backdrop-filter:blur(6px)}

.mark span{color:var(--olive)}

/* ── héros ──────────────────────────────────────────────────── */

.hero .side{flex:1;min-width:0}
.hero .big{font-family:var(--disp);font-weight:800;font-size:42px;letter-spacing:-.05em;line-height:1;
           font-variant-numeric:tabular-nums;transition:color .4s}
.hero .sub{color:var(--dim);font-size:13px;margin-top:7px}
.verdict{display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:7px 13px;border-radius:99px;
         font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.verdict i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ── onglets ────────────────────────────────────────────────── */
.tabs{display:flex;gap:8px;padding:0 var(--pad) 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);
     font-size:13.5px;font-weight:600;color:var(--dim);transition:.15s}
.tab[aria-pressed="true"]{background:var(--ink);color:#16211A;border-color:var(--ink)}

/* ── cartes bocaux ──────────────────────────────────────────── */
.rows{padding:0 var(--pad);display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
      border-radius:20px;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.988)}
.card .open{display:flex;gap:14px;align-items:center;flex:1;min-width:0;padding:13px 4px 13px 14px;text-align:left}
.card .mid{flex:1;min-width:0}
.card .nm{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.025em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .amt{text-align:right;padding-right:4px}
.card .amt b{font-family:var(--num);font-size:16.5px;font-weight:700;display:block;letter-spacing:-.02em}

.card .quick{width:54px;flex-shrink:0;display:grid;place-items:center;font-size:24px;font-weight:300;
             color:var(--olive);border-left:1px solid var(--line);background:rgba(180,206,94,.05)}
.card .quick:active{background:rgba(180,206,94,.16)}

.empty{margin:6px var(--pad);padding:30px 22px;border:1.5px dashed var(--line2);border-radius:22px;
       text-align:center;color:var(--dim)}
.empty b{display:block;font-family:var(--disp);font-size:20px;color:var(--ink);margin-bottom:8px}

.sect{padding:26px var(--pad) 0}
.sect h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
         font-weight:600;margin-bottom:8px}
.fitem{display:flex;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.fitem .fe{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.fitem .ft{flex:1;min-width:0}
.fitem .ft b{font-weight:600;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .ft small{color:var(--faint);font-size:11.5px}
.fitem .fa{font-family:var(--num);font-weight:700;font-size:14.5px}
.x{color:var(--faint);padding:4px 6px;font-size:19px;line-height:1}

/* ── bouton flottant ────────────────────────────────────────── */
.fab{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
     z-index:40;display:flex;gap:9px;align-items:center;background:var(--olive);color:#16211A;
     padding:16px 28px;border-radius:99px;font-family:var(--disp);font-weight:800;font-size:16.5px;
     box-shadow:0 12px 30px rgba(0,0,0,.5);letter-spacing:-.01em}
.fab:active{transform:translateX(-50%) scale(.955)}

/* ── feuilles ───────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.76);z-index:50;display:flex;align-items:flex-end;
       justify-content:center;animation:fade .18s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg2);border-top:1px solid var(--line2);border-radius:28px 28px 0 0;width:100%;
       max-width:480px;max-height:93vh;overflow:auto;padding:8px var(--pad) calc(28px + env(safe-area-inset-bottom));
       animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(34px)}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:5px auto 18px}
.sheet h2{font-size:25px;margin-bottom:18px}
.amount{font-family:var(--disp);font-weight:800;font-size:56px;letter-spacing:-.055em;text-align:center;
        padding:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.05}
.amount small{font-size:26px;color:var(--faint)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 0;
     font-family:var(--num);font-size:23px;font-weight:700}
.key:active{background:var(--card2)}
.seg{display:flex;gap:13px;align-items:center;background:var(--card);border:1.5px solid var(--line);
     border-radius:16px;padding:13px 15px;text-align:left;width:100%}
.seg[aria-pressed="true"]{border-color:var(--olive);background:var(--card2)}
.seg .st{flex:1}
.seg .st b{display:block;font-weight:600;font-size:14.5px}
.seg .st small{color:var(--dim);font-size:12px;line-height:1.4}
.codebox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
         border-radius:15px;padding:15px 16px;font-family:var(--num);font-size:20px;letter-spacing:.2em;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
       z-index:60;background:var(--ink);color:#16211A;padding:12px 19px;border-radius:99px;font-weight:600;
       font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:fade .2s;max-width:88%;text-align:center}
.banner{margin:0 var(--pad) 12px;padding:12px 15px;border-radius:15px;background:rgba(245,185,58,.12);
        border:1px solid rgba(245,185,58,.28);color:var(--gold);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ═══ constantes ═══════════════════════════════════════════════ */
const DAY = 86400000;
const PROFILES = {
  regulier:{nom:'Régulier',      desc:"Un peu chaque jour — courses, essence, cantine",              f:t=>t},
  depart:  {nom:'Gros départ',   desc:"Ça part très fort puis ça retombe — transport, courses de départ", f:t=>1-Math.pow(1-t,2.4)},
  montee:  {nom:'Ça monte',      desc:"Doucement puis ça s'emballe — cadeaux, fin de mois",          f:t=>Math.pow(t,2.4)},
  unefois: {nom:'Une seule fois',desc:"Tout d'un coup au début — billets, caution, acompte",         f:t=>t>0?1:0},
};
const EMOJIS=['🛒','🍽️','⛽','🚗','🏠','💡','📱','👕','💊','🎁','🍿','☕','🍺','✈️','🏨','🚄','🎓','🐈','🧴','🛠️','🎮','📚','💇','🎂','🌱','🏊','🎸','🩺','🧾','🚲','🍕','🧃'];
const ESCMOJIS=['✈️','🏖️','⛰️','🎄','🏕️','🚗','🛳️','🎡','🎿','🏰'];
const AVATARS=['🦊','🐙','🐝','🦉','🐢','🦩','🐳','🦔','🐧','🦄','🐸','🦜'];
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';

const eur=(n,d=0)=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const money=n=>Number.isInteger(n)?eur(n):eur(n,2);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newCode=()=>Array.from({length:8},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
const nb=v=>parseFloat(String(v).replace(',','.'))||0;

/* mémoire locale, avec repli si le navigateur la refuse */
const mem={};
const store={
  get(k){ try{return localStorage.getItem(k)}catch(e){return mem[k]??null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){mem[k]=v} },
  del(k){ try{localStorage.removeItem(k)}catch(e){delete mem[k]} },
};

/* ═══ état ═════════════════════════════════════════════════════ */
let sb=null, moi=null, S=null, tab='tout', sheet=null, draft={}, live=false, canal=null;
const blank=()=>({v:1,membres:{},enveloppes:[],depenses:[],escapades:[]});
const app=document.getElementById('app');

/* ═══ fusion (deux téléphones en même temps) ═══════════════════ */
function mergeList(a=[],b=[]){
  const m=new Map();
  for(const it of [...a,...b]){const p=m.get(it.id); if(!p||(it.maj||0)>=(p.maj||0)) m.set(it.id,it);}
  return [...m.values()];
}
function merge(a,b){
  if(!a) return b; if(!b) return a;
  const membres={...(a.membres||{})};
  for(const [k,v] of Object.entries(b.membres||{}))
    if(!membres[k]||(v.vu||0)>(membres[k].vu||0)) membres[k]=v;
  return {v:1,membres,
    enveloppes:mergeList(a.enveloppes,b.enveloppes),
    depenses:mergeList(a.depenses,b.depenses),
    escapades:mergeList(a.escapades,b.escapades)};
}

/* ═══ base ═════════════════════════════════════════════════════ */
async function fetchFoyer(code){
  const {data,error}=await sb.from('foyers').select('data').eq('code',code).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
let pushT=null;
function push(){ clearTimeout(pushT); pushT=setTimeout(sauver,300); }
async function sauver(){
  try{
    const distant=await fetchFoyer(moi.code);
    S=merge(distant,S);
    const {error}=await sb.from('foyers').upsert({code:moi.code,data:S,maj:new Date().toISOString()});
    if(error) throw error;
    live=true;
  }catch(e){ live=false; console.warn(e); }
  paint();
}
function ecouter(){
  if(canal) sb.removeChannel(canal);
  canal=sb.channel('foyer-'+moi.code)
    .on('postgres_changes',
        {event:'*',schema:'public',table:'foyers',filter:'code=eq.'+moi.code},
        p=>{ if(p.new?.data) recevoir(p.new.data); })
    .subscribe(st=>{ live = st==='SUBSCRIBED'; paint(); });
}
function recevoir(distant){
  const avant=new Set(S.depenses.filter(d=>!d.sup).map(d=>d.id));
  S=merge(S,distant);
  for(const d of S.depenses){
    if(!d.sup && !avant.has(d.id) && d.par!==moi.id){
      const e=S.enveloppes.find(x=>x.id===d.env), m=S.membres[d.par];
      toast(`${m?m.nom:'Quelqu\'un'} · ${e?e.emoji+' '+e.nom:''} −${money(d.montant)}`);
    }
  }
  paint(); if(sheet) renderSheet();
}

/* ═══ rythme ═══════════════════════════════════════════════════ */
function bornes(env,now=Date.now()){
  let deb=new Date(env.debut).getTime(); const len=env.jours*DAY;
  if(env.recurrent) while(now>=deb+len) deb+=len;
  return {deb,fin:deb+len,len};
}
function etat(env,now=Date.now()){
  const {deb,fin,len}=bornes(env,now);
  const ecoule=clamp((now-deb)/len,0,1);
  const attFrac=clamp(PROFILES[env.profil].f(ecoule),0,1);
  const depense=S.depenses.filter(d=>!d.sup&&d.env===env.id&&d.at>=deb&&d.at<fin).reduce((s,d)=>s+d.montant,0);
  const reste=env.montant-depense, attendu=env.montant*attFrac;
  const joursR=Math.max(0,Math.ceil((fin-now)/DAY));
  const rythme=attendu>.5?depense/attendu:(depense>0?3:1);
  const projete=attFrac>.05?depense/attFrac:null;
  let ton='ok',mot='pile poil';
  if(depense>env.montant){ton='mal';mot='bocal vide';}
  else if(ecoule>=1){ton='ok';mot='terminé, tenu';}
  else if(rythme>1.3){ton='mal';mot='ça part vite';}
  else if(rythme>1.08){ton='moy';mot='un peu vite';}
  else if(rythme<.75){ton='ok';mot='tranquille';}
  return {deb,fin,ecoule,attFrac,depense,reste,attendu,joursR,rythme,projete,ton,mot,
          niveau:clamp(reste/env.montant,0,1),attNiveau:clamp(1-attFrac,0,1)};
}
const TON={ok:'var(--olive)',moy:'var(--gold)',mal:'var(--tomato)'};

/* ═══ le bocal ═════════════════════════════════════════════════ */
let jn=0;
function bocal(niveau,attNiveau,ton,w=54,vague=false){
  const id='j'+(jn++), h=Math.round(w*1.3);
  const bx=w*.1,by=h*.2,bw=w-bx*2,bh=h-by-h*.04,r=w*.17;
  const yl=by+bh*(1-niveau), ya=by+bh*(1-attNiveau), col=TON[ton];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex-shrink:0;display:block">
  <defs><clipPath id="${id}"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${r}"/></clipPath></defs>
  <rect x="${w*.24}" y="${h*.05}" width="${w*.52}" height="${h*.105}" rx="${w*.045}" fill="var(--card2)"/>
  <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${r}" fill="rgba(0,0,0,.25)"/>
  <g clip-path="url(#${id})">
    <rect x="${bx}" y="${yl}" width="${bw}" height="${bh}" fill="${col}" opacity=".9"
          style="transition:y .55s cubic-bezier(.3,.9,.3,1)"/>
    ${vague&&niveau>.02&&niveau<.99?`<path d="M0 7 Q ${w*.5} -4 ${w} 7 T ${w*2} 7 V ${h} H0 Z" fill="${col}" opacity=".9">
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
        values="0 ${yl-7}; ${-w} ${yl-7}"/></path>`:''}
    <rect x="${bx}" y="${yl}" width="${bw}" height="2" fill="#fff" opacity=".3"/>
  </g>
  <line x1="${bx-1.5}" y1="${ya}" x2="${bx+bw+1.5}" y2="${ya}" stroke="var(--ink)" stroke-width="1.5"
        stroke-dasharray="3 3" opacity=".65"/>
  <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${r}" fill="none" stroke="var(--ink)"
        stroke-width="1.4" opacity=".32"/></svg>`;
}
function courbe(k,w=50,h=22){
  const f=PROFILES[k].f;
  const p=Array.from({length:17},(_,i)=>{const t=i/16;return `${(t*w).toFixed(1)},${(h-f(t)*h).toFixed(1)}`});
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex-shrink:0">
    <polyline points="${p.join(' ')}" fill="none" stroke="var(--olive)" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function quand(t){
  const d=(Date.now()-t)/60000;
  if(d<1) return "à l'instant";
  if(d<60) return `il y a ${Math.round(d)} min`;
  if(d<1440) return `il y a ${Math.round(d/60)} h`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function toast(t){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el=document.createElement('div'); el.className='toast'; el.textContent=t;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

function vueFoyer(){
  const now=Date.now();
  const escs=S.escapades.filter(e=>!e.sup);
  const tousEnv=S.enveloppes.filter(e=>!e.sup);
  let envs=tousEnv;
  if(tab==='fixe') envs=envs.filter(e=>!e.escapade);
  else if(tab!=='tout') envs=envs.filter(e=>e.escapade===tab);
  envs=envs.map(e=>({e,s:etat(e,now)})).sort((a,b)=>b.s.rythme-a.s.rythme);

  const tous=tousEnv.map(e=>etat(e,now));
  const budget=tousEnv.reduce((s,e)=>s+e.montant,0);
  const T=tous.reduce((s,x)=>({d:s.d+x.depense,a:s.a+x.attendu,r:s.r+x.reste}),{d:0,a:0,r:0});
  const niveau=budget?clamp(T.r/budget,0,1):0, attN=budget?clamp(1-T.a/budget,0,1):0;
  const ry=T.a>.5?T.d/T.a:1;
  let ton='ok',mot='vous tenez le rythme';
  if(T.d>budget){ton='mal';mot='budget dépassé';}
  else if(ry>1.3){ton='mal';mot='ça part vite en ce moment';}
  else if(ry>1.08){ton='moy';mot='un poil au-dessus';}
  else if(ry<.75){ton='ok';mot='vous êtes large';}

  const membres=Object.values(S.membres||{}).sort((a,b)=>(b.vu||0)-(a.vu||0));
  const recentes=S.depenses.filter(d=>!d.sup).sort((a,b)=>b.at-a.at).slice(0,14);

  return `
  <header>
    <div class="mark">BO<span>CAL</span></div>
    <span class="live ${live?'':'off'}"><i></i>${live?'en direct':'hors ligne'}</span>
    <div class="avs">
      ${membres.slice(0,4).map(m=>`<div class="av ${now-(m.vu||0)<180000?'on':''}" title="${esc(m.nom)}">${m.emoji}</div>`).join('')}
      <button class="cog" data-a="reglages">⚙︎</button>

  <div class="hero">
    ${bocal(niveau,attN,ton,96,true)}
    <div class="side">
      <div class="eyebrow">il vous reste</div>
      <div class="big" style="color:${TON[ton]}">${budget?money(T.r):'—'}</div>
      <div class="sub">sur ${money(budget)} · ${tousEnv.length} bocal${tousEnv.length>1?'x':''}</div>
      <div class="verdict" style="color:${TON[ton]}"><i></i>${mot}</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" data-a="tab" data-v="tout" aria-pressed="${tab==='tout'}">Tout</button>
    <button class="tab" data-a="tab" data-v="fixe" aria-pressed="${tab==='fixe'}">Au quotidien</button>
    ${escs.map(e=>`<button class="tab" data-a="tab" data-v="${e.id}" aria-pressed="${tab===e.id}">${e.emoji} ${esc(e.nom)}</button>`).join('')}
    <button class="tab" data-a="escapade-new">+ Escapade</button>
  </div>

  ${envs.length?`<div class="rows">${envs.map(({e,s})=>carte(e,s)).join('')}</div>
    <div class="sect" style="padding-top:14px"><button class="btn ghost" data-a="env-new">+ Nouveau bocal</button></div>`
  :`<div class="empty"><b>Aucun bocal ici</b>Un bocal = un poste, une somme, une durée. Commencez par les courses.
    <div style="margin-top:18px"><button class="btn" data-a="env-new">Créer un bocal</button></div></div>`}

  ${recentes.length?`<div class="sect"><h3>Dernières dépenses</h3>
    ${recentes.map(d=>{const e=S.enveloppes.find(x=>x.id===d.env),m=S.membres[d.par];
      return `<div class="fitem"><div class="fe">${e?e.emoji:'💸'}</div>

        <small>${m?esc(m.nom):'?'} · ${quand(d.at)}${d.note&&e?' · '+esc(e.nom):''}</small></div>

function carte(env,s){
  const detail=(s.ecoule>=1&&!env.recurrent)?'terminé'
    :`${s.joursR} j · ${s.mot}`+(s.projete!=null&&s.ecoule>.08&&s.ecoule<1?` · finira vers ${money(Math.round(s.projete))}`:'');
  return `<div class="card">
    <button class="open" data-a="env" data-v="${env.id}">
      ${bocal(s.niveau,s.attNiveau,s.ton,42)}
      <div class="mid"><div class="nm">${env.emoji} ${esc(env.nom)}</div>
      <div class="meta" style="color:${s.ton==='ok'?'var(--dim)':TON[s.ton]}">${detail}</div></div>
      <div class="amt"><b style="color:${TON[s.ton]}">${money(Math.max(s.reste,0))}</b><i>reste</i></div>
    </button>
    <button class="quick" data-a="add-in" data-v="${env.id}" aria-label="Ajouter une dépense">＋</button>
  </div>`;
}

function openSheet(k,d={}){ sheet=k; draft.s={...d}; renderSheet(); }
function closeSheet(){ sheet=null; draft.s={}; document.querySelector('.scrim')?.remove(); }
function renderSheet(){
  document.querySelector('.scrim')?.remove();
  if(!sheet) return;
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet"><div class="grab"></div>${SHEETS[sheet]()}</div>`;
  document.body.appendChild(el);
}

/* ═══ actions ══════════════════════════════════════════════════ */
function grabEnv(d){
  const n=document.getElementById('i-envnom'); if(n) d.nom=n.value.trim();
  const m=document.getElementById('i-montant'); if(m) d.montant=nb(m.value);
  const j=document.getElementById('i-jours'); if(j&&j.value) d.jours=parseInt(j.value)||d.jours;
}
const touch=()=>{ if(S.membres[moi.id]) S.membres[moi.id].vu=Date.now(); };

document.addEventListener('click',async ev=>{
  if(ev.target.classList?.contains('scrim')) return closeSheet();
  const b=ev.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v, d=draft.s||{};

  if(a==='mode'){ draft.porte.mode=v; draft.porte.nom=val('i-nom'); paint(); return; }
  if(a==='avatar'){ draft.porte.emoji=v; draft.porte.nom=val('i-nom'); draft.porte.code=val('i-code'); paint(); return; }
  if(a==='entrer'){
    const p=draft.porte; p.nom=val('i-nom').trim(); p.code=(val('i-code')||'').trim().toUpperCase();
    if(!p.nom) return toast('Il manque votre prénom');
    if(p.mode==='rejoindre'&&p.code.length!==8) return toast('Le code fait 8 caractères');
    const code=p.mode==='creer'?newCode():p.code;
    let distant=null;
    try{ distant=await fetchFoyer(code); }
    catch(e){ return toast('Connexion à la base impossible'); }
    if(p.mode==='rejoindre'&&!distant) return toast('Aucun foyer avec ce code');
    moi={code,id:uid(),nom:p.nom,emoji:p.emoji};
    S=distant||blank();
    S.membres[moi.id]={id:moi.id,nom:moi.nom,emoji:moi.emoji,vu:Date.now()};
    store.set('bocal.moi',JSON.stringify(moi));
    ecouter(); await sauver();
    if(p.mode==='creer') openSheet('reglages');
    return;
  }

  if(a==='tab'){ tab=v; paint(); return; }
  if(a==='close'){ closeSheet(); return; }
  if(a==='reglages'){ openSheet('reglages'); return; }
  if(a==='add'){ openSheet('add'); return; }
  if(a==='add-in'){ openSheet('add',{env:v}); return; }
  if(a==='env-new'){ openSheet('env'); return; }
  if(a==='escapade-new'){ openSheet('escapade'); return; }
  if(a==='env'){ openSheet('detail',{id:v}); return; }
  if(a==='edit-env'){ openSheet('env',{...S.enveloppes.find(e=>e.id===v)}); return; }

  if(a==='key'){
    let s=d.val||'0';
    if(v==='⌫') s=s.length>1?s.slice(0,-1):'0';
    else if(v===','){ if(!s.includes('.')) s+='.'; }
    else { s=s==='0'?v:s+v; if(s.includes('.')&&s.split('.')[1].length>2) return; }
    d.val=s; d.note=val('i-note'); renderSheet(); return;
  }
  if(a==='pickenv'){ d.env=v; d.note=val('i-note'); renderSheet(); return; }
  if(a==='save-add'){
    const montant=nb(d.val);
    if(montant<=0) return toast('Le montant est à zéro');
    S.depenses.push({id:uid(),env:d.env,montant,note:val('i-note').trim(),par:moi.id,at:Date.now(),maj:Date.now()});
    touch(); closeSheet(); paint(); push(); toast(`−${money(montant)} enregistré`); return;
  }
  if(a==='del-dep'){ const x=S.depenses.find(z=>z.id===v); if(x){x.sup=true;x.maj=Date.now();} renderSheet(); paint(); push(); return; }

  if(a==='emojis'){ grabEnv(d); d.emojis=!d.emojis; renderSheet(); return; }
  if(a==='pickemoji'){ grabEnv(d); d.emoji=v; d.emojis=false; renderSheet(); return; }
  if(a==='jours'){ grabEnv(d); d.jours=+v; renderSheet(); return; }
  if(a==='profil'){ grabEnv(d); d.profil=v; renderSheet(); return; }
  if(a==='recurrent'){ grabEnv(d); d.recurrent=v==='1'; renderSheet(); return; }
  if(a==='rattache'){ grabEnv(d); d.escapade=v||null; renderSheet(); return; }
  if(a==='save-env'){
    grabEnv(d);
    if(!d.nom) return toast('Il manque le nom');
    if(!(d.montant>0)) return toast('Il manque le montant');
    if(!(d.jours>0)) return toast('Il manque la durée');
    const es=d.escapade?S.escapades.find(x=>x.id===d.escapade):null;
    const base={nom:d.nom,emoji:d.emoji,montant:d.montant,jours:+d.jours,profil:d.profil,
                recurrent:!!d.recurrent&&!es,escapade:d.escapade||null,maj:Date.now()};
    if(d.id) Object.assign(S.enveloppes.find(e=>e.id===d.id),base);
    else S.enveloppes.push({id:uid(),debut:es?es.debut:new Date().toISOString().slice(0,10),...base});
    touch(); closeSheet(); paint(); push(); return;
  }
  if(a==='del-env'){ const x=S.enveloppes.find(e=>e.id===v); if(x){x.sup=true;x.maj=Date.now();} touch(); closeSheet(); paint(); push(); toast('Bocal supprimé'); return; }

  if(a==='save-esc'){
    const nom=val('i-escnom').trim(), deb=val('i-deb'), fin=val('i-fin');
    if(!nom) return toast('Il manque le nom');
    if(!deb||!fin) return toast('Il manque les dates');
    const jours=Math.max(1,Math.round((new Date(fin)-new Date(deb))/DAY)+1), id=uid();
    S.escapades.push({id,nom,emoji:d.emoji,debut:deb,fin,jours,maj:Date.now()});
    touch(); closeSheet(); tab=id; paint(); push();
    openSheet('env',{escapade:id,jours,recurrent:false,profil:'depart',emoji:'🚗',nom:'Transport'});
    return;
  }

  if(a==='monavatar'){ S.membres[moi.id].emoji=v; S.membres[moi.id].nom=val('i-monnom'); touch(); renderSheet(); push(); return; }
  if(a==='save-moi'){
    S.membres[moi.id].nom=val('i-monnom').trim()||moi.nom; touch();
    moi.nom=S.membres[moi.id].nom; moi.emoji=S.membres[moi.id].emoji;
    store.set('bocal.moi',JSON.stringify(moi));
    closeSheet(); paint(); push(); toast("C'est noté"); return;
  }
  if(a==='copier'){ try{ await navigator.clipboard.writeText(moi.code); toast('Code copié'); }catch(e){ toast('Code : '+moi.code); } return; }
  if(a==='quitter'){ store.del('bocal.moi'); if(canal) sb.removeChannel(canal); moi=null; S=null; draft={}; closeSheet(); paint(); return; }
});

/* ═══ démarrage ════════════════════════════════════════════════ */
(async function(){
  const U=(window.SUPABASE_URL||'').trim(), K=(window.SUPABASE_KEY||'').trim();
  if(U&&K){ try{ sb=createClient(U,K); }catch(e){ sb=null; } }
  if(sb){
    try{
      const raw=store.get('bocal.moi');
      if(raw){
        moi=JSON.parse(raw);
        S=(await fetchFoyer(moi.code))||blank();
        if(!S.membres[moi.id]) S.membres[moi.id]={id:moi.id,nom:moi.nom,emoji:moi.emoji,vu:Date.now()};
        ecouter();
      }
    }catch(e){ live=false; }
  }
  paint();
  setInterval(()=>{ if(moi&&!sheet){ touch(); push(); } },60000);
  document.addEventListener('visibilitychange',async()=>{
    if(!document.hidden&&moi){ try{ const d=await fetchFoyer(moi.code); if(d) recevoir(d); }catch(e){} }
  });
})();
</script>
</body>
